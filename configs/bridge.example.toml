# sl651-bridge 配置示例
# 使用: sl651-bridge --config /path/to/bridge.toml
# 环境变量可覆盖关键项: SL651_LISTEN_TCP / SL651_LISTEN_UDP /
#   SL651_TB_HOST / SL651_TB_PORT / SL651_TB_USERNAME / SL651_TB_PASSWORD /
#   SL651_TB_CLIENT_ID / SL651_LOG_LEVEL

[listen]
# TCP 监听地址 (遥测站 TCP 接入), 置空 "" 禁用
tcp = "0.0.0.0:9000"
# UDP 监听地址, 置空 "" 禁用
udp = "0.0.0.0:9000"
# TCP 连接空闲超时 (秒)
idle_timeout_secs = 900
# 单连接累积缓冲上限 (字节)
max_buffer = 65536

[center]
# 本中心站地址 (帧头, 1~255)
address = 1
# 期望密码 (4 位十六进制字符); check_password 开启时校验
password = "0000"
check_password = false
# 校验上行帧中心站地址与本机一致 (中继/多中心场景开启)
check_address = false

[ack]
# 对上行报文回确认帧 (M2); 关闭则纯接收不应答
enabled = true
# ETX 后的最终终止符: "EOT" 站端立即退出(默认省功耗) | "ESC" 站端保持在线 10 分钟
final_terminator = "EOT"

[m3]
# M3 多包重组超时 (秒), 超时丢弃未完成分包
reassembly_timeout_secs = 180

[dedup]
# 流水号去重 (M2 重发不重复入库, 但仍应答)
enabled = true
window_secs = 600

# 遥测站地址 -> 设备别名 (可选; 不配则使用设备上报原站码)
# 命名策略: 全部使用协议源码不翻译 —— 设备名=站码, 点位键=规约标识符(Z/VT/PT/...)
[stations]
"0100000001" = { name = "样机1" }

[tb]
# 转发模式: "mqtt" 正式中转 | "log" 仅打印不连接 (本地接入验证, 见 configs/local-test.toml)
mode = "mqtt"
# ThingsBoard MQTT (网关设备凭据, MQTT_BASIC)
host = "thingsboard.example.com"
port = 1883
client_id = "sl651-bridge"
username = "gw-sl651-access-token-or-user"
password = ""
keepalive_secs = 60
qos = 1
# 断线溢出缓冲上限 (条数, 满则丢最旧并告警)
buffer = 10000

[payload]
# 与网关规则链服务端属性对应 (ss_dataPath / ss_timePath / ss_keySplitter)
data_path = "points"
time_path = "time"
key_splitter = ":"

[images]
# 图片报 (36H) 重组落盘
enabled = true
dir = "/var/lib/sl651-bridge/images"

[log]
level = "info"
# json | pretty
format = "json"
